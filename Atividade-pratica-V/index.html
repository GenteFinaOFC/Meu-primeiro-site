<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <h1>Login</h1>
    <form action="feed.html" method="POST">
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" required>
        <br>
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Entrar</button>
        <input type="button" value="Registrar" onclick="window.location.href='cadastro.html'">
        <input type="button" value="Esqueci minha senha" onclick="window.location.href='esqueci-senha.html'">
    </form>
</body>
</html>
